name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/LaboratoryJournal.Tests/LaboratoryJournal.Tests.csproj

      - name: Build
        run: dotnet build tests/LaboratoryJournal.Tests/LaboratoryJournal.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/LaboratoryJournal.Tests/LaboratoryJournal.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage"
